# Please refer https://aka.ms/HTTPSinContainer on how to setup an https developer certificate for your ASP.NET Core service.

services:
  thesocialnetworkapi:
    image: thesocialnetworkapi
    build:
      context: .
      dockerfile: src/TheSocialNetwork.Api/Dockerfile
    ports:
      - 8080:8080
    environment:
      - Database__ConnectionString=Host=postgres;Port=5432;Database=the_social_network;Username=admin;Password=admin
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health/ready"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

  postgres:
    image: postgres:17-alpine
    environment:
      - POSTGRES_DB=the_social_network
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
    ports:
      - 5432:5432
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d the_social_network"]
      interval: 5s
      timeout: 5s
      retries: 10

  flyway:
    image: flyway/flyway:latest
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - migrate
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/the_social_network
      FLYWAY_USER: admin
      FLYWAY_PASSWORD: admin
      FLYWAY_LOCATIONS: filesystem:/flyway/sql
    volumes:
      - ./database/migrations:/flyway/sql:ro

volumes:
  postgres-data:
